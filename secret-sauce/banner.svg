<svg fill="none" width="838" height="235" viewBox="0 0 838 235" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="838" height="235">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');

        .card {
          background: linear-gradient(180deg, #0d1117 0%, #0d1117 75%, rgba(13, 17, 23, 0) 100%);
          border: none;
          padding: 24px;
          font-family: 'Inter', sans-serif;
          box-sizing: border-box;
          height: 235px;
          color: #f7f7ff;
          position: relative;
        }

        .layout {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          height: 100%;
        }

        .content-area {
          flex-grow: 1;
          padding-right: 24px;
        }

        .profile-wrapper {
          flex-shrink: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .profile-img {
          width: 80px;
          height: 80px;
          border-radius: 50%;
          border: none;
          background-color: #161b22;
          object-fit: cover;
          display: block;
        }

        p { margin: 0 0 10px 0; line-height: 1.5; }

        .title {
          font-size: 20px;
          font-weight: 600;
          margin-bottom: 6px;
        }

        .details, .suspect-places {
          font-size: 15px;
          font-weight: 400;
          color: #f7f7ff;
        }

        .details { margin-bottom: 12px; }

        .typing-container {
          display: block;
          height: 32px;
          margin-bottom: 4px;
        }

        .typing-text {
          font-size: 24px;
          font-weight: 700;
          display: inline-block;
          white-space: nowrap;
          overflow: hidden;
          border-right: 10px solid #45CB85;
          color: #279AF1;
          animation: 
            type-cycle 15s steps(30, end) infinite,
            cursor-blink 0.75s step-end infinite;
        }

        .places-title {
          font-weight: 600;
          margin-bottom: 0px;
          display: block;
        }

        @keyframes type-cycle {
          0% { width: 0; }
          3%, 17% { width: 18ch; }
          20% { width: 0; }

          21% { width: 0; }
          24%, 37% { width: 11ch; }
          40% { width: 0; }

          41% { width: 0; }
          44%, 57% { width: 28ch; }
          60% { width: 0; }

          61% { width: 0; }
          64%, 77% { width: 8ch; }
          80% { width: 0; }

          81% { width: 0; }
          84%, 97% { width: 8.5ch; }
          100% { width: 0; }
        }

        .typing-text::before {
          content: "Front-End Developer";
          animation: text-switch 15s infinite;
        }

        @keyframes text-switch {
          0%, 20% { content: "Front-End Developer"; }
          21%, 40% { content: "UX Designer"; }
          41%, 60% { content: "Mechanical keyboard enthusiast"; }
          61%, 80% { content: "Car lover"; }
          81%, 100% { content: "Tired Dad"; }
        }

        @keyframes cursor-blink {
          50% { border-color: transparent; }
        }

        /* Positioned right under the "When I'm not..." text */
        .arrow-container {
          position: absolute;
          bottom: 2px;
          left: 20px;
          width: 80px;
          height: 70px;
          pointer-events: none;
        }

        .arrow-line, .arrow-head {
          stroke: #279AF1;
          stroke-width: 3;
          stroke-linecap: round;
          stroke-linejoin: round;
          fill: none;
        }

        .arrow-line {
          stroke-dasharray: 220;
          stroke-dashoffset: 220;
          animation: drawTail 4s ease-in-out infinite;
        }

        .arrow-head {
          stroke-dasharray: 50;
          stroke-dashoffset: 50;
          animation: drawHead 4s ease-in-out infinite;
        }

        @keyframes drawTail {
          0% { stroke-dashoffset: 220; opacity: 1; }
          45%, 85% { stroke-dashoffset: 0; opacity: 1; }
          95%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes drawHead {
          0%, 45% { stroke-dashoffset: 50; opacity: 1; }
          65%, 85% { stroke-dashoffset: 0; opacity: 1; }
          95%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }
      </style>
      <div class="card">
        <div class="layout">
          <div class="content-area">
            <p class="title">Hi! I'm David, and I am a...</p>
            <div class="typing-container">
              <span class="typing-text"></span>
            </div>
            <p>from 🇬🇧</p>
            <!-- <p class="details">
              I am currently working as a UX/UI Developer, and in my spare time I'm full time Dad.
            </p> -->
            <span class="places-title suspect-places">When I'm not working or dadding, you can find me in these suspect places:</span>
          </div>

          <div class="profile-wrapper">
            <img class="profile-img" src="data:image/jpeg;base64," alt="Profile" />
          </div>
        </div>
        <div class="arrow-container">
          <svg width="80" height="70" viewBox="0 0 80 70" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="arrow-line" d="M 15 2 C 45 2, 65 12, 50 30 C 35 48, 10 35, 28 20 C 45 8, 58 38, 38 60" />
            <path class="arrow-head" d="M 26 50 L 38 62 L 50 52" />
          </svg>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
