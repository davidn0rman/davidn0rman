<svg fill="none" width="838" height="838" viewBox="0 0 838 838" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="838" height="838">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .screensaver-box {
          background: #0d1117;
          border-radius: 12px;
          width: 838px;
          height: 838px;
          position: relative;
          overflow: hidden;
          box-sizing: border-box;
        }

        .x-wrapper {
          position: absolute;
          top: 0;
          left: 0;
          animation: moveX 8.2s linear infinite alternate;
        }

        .y-wrapper {
          animation: moveY 5.4s linear infinite alternate;
        }

        .dvd-img {
          width: 120px;
          height: auto;
          display: block;
        }

        @keyframes moveX {
          0%   { transform: translateX(0px); }
          100% { transform: translateX(718px); }
        }

        @keyframes moveY {
          0%   { transform: translateY(0px); }
          100% { transform: translateY(750px); }
        }
      </style>

      <div class="screensaver-box">
        <div class="x-wrapper">
          <div class="y-wrapper">
                            <img class="profile-img" src="data:image/jpeg;base64," alt="Profile" />
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
